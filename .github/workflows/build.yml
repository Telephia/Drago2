name: Build FlyingMOD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup XMake
        uses: xmake-io/github-action-setup-xmake@v1.0.13
        with:
          xmake-version: '>=3.0.0'

      - name: Update xmake repo
        run: xmake repo --update

      - name: Clone CommonLibSSE (libxse)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/libxse/commonlibsse.git deps/commonlibsse
          git clone --depth 1 https://github.com/libxse/commonlib-shared.git deps/commonlibsse/lib/commonlib-shared

      - name: Configure
        run: xmake f --mode=release --commonlib_xbyak=y --yes

      - name: Build
        shell: bash
        run: |
          xmake -y 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Publish error log
        if: failure()
        shell: bash
        run: |
          tail -n 1000 build.log > error-tail.log || cp build.log error-tail.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B build-errors
          git add error-tail.log
          git commit -m "chore: publish build error log (auto)"
          git push origin HEAD:refs/heads/build-errors --force

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: FlyingMOD-HoverMomentum
          path: build/windows/x64/release/FlyingMOD.dll
          if-no-files-found: error
