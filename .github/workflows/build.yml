name: Build FlyingMOD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup XMake
        uses: xmake-io/github-action-setup-xmake@v1.0.13
        with:
          xmake-version: '>=3.0.0'

      - name: Update xmake repo
        run: xmake repo --update

      - name: Clone CommonLibSSE (libxse)
        shell: bash
        run: |
          mkdir -p deps/commonlibsse/lib
          git clone --depth 1 https://github.com/libxse/commonlibsse.git deps/commonlibsse
          git clone --depth 1 https://github.com/libxse/commonlib-shared.git deps/commonlibsse/lib/commonlib-shared

      - name: Configure
        run: xmake f --mode=release --commonlib_xbyak=y --yes

      - name: Build
        run: xmake -y

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: FlyingMOD-HoverMomentum
          path: build/windows/x64/release/FlyingMOD.dll
          if-no-files-found: error
